services:
  - type: web
    name: horary-oracle-api
    runtime: python
    plan: free
    buildCommand: pip install -r horary_oracle/requirements.txt
    startCommand: uvicorn horary_oracle.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"
  - type: web
    name: horary-oracle-web
    runtime: python
    plan: free
    buildCommand: pip install -r horary_oracle/requirements.txt
    startCommand: streamlit run horary_oracle/horary_app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: MPLBACKEND
        value: "Agg"
      - key: PYTHON_VERSION
        value: "3.12.8"
