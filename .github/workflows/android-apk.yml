name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fast_mobile/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast_mobile/flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Ensure NDK 26.3
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.3.11579264" || echo "NDK 26.3 kurulamadi, runner uzerinde var sayiliyor"

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: fast-debug-apk
          path: fast_mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk