name: Horary iOS
on:
  workflow_dispatch:
  push:
    paths: [ 'horary_ios/**', 'codemagic.yaml' ]
jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: horary_ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: 'stable', cache: true }
      - run: flutter pub get
      - run: pod install --repo-update
        working-directory: horary_ios/ios
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload && cp -r Runner.app Payload/ && zip -r ../ipa/Horary-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Horary-unsigned-ipa, path: horary_ios/build/ios/ipa/*.ipa }
