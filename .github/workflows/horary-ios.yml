name: Horary iOS
on:
  workflow_dispatch:
  push:
    paths: [ 'horary_ios/**', 'codemagic.yaml' ]
jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: horary_ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 'stable', channel: 'stable' }
      - run: flutter pub get
      - run: cd ios && pod install --repo-update
      - run: flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with: { name: Horary-unsigned-ipa, path: horary_ios/build/ios/ipa/*.ipa }
