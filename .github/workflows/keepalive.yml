name: keepalive

# Render free plan: 15 dk istek gelmezse servis uykuya gecer ve ilk istek
# 30-60 sn (bazen 503) surer. Bu is GERCEK servisleri 5 dakikada bir uyandirir.
#
# ONEMLI: Uygulamanin kullandigi ana backend
#   https://fbst-api-mzum.onrender.com  (lib/config/api_config.dart -> baseUrl)
# Eskiden burada https://fbst-api.onrender.com pingleniyordu; o adres 404
# döndüğü için gercek backend hic uyanik tutulmuyordu.

on:
  schedule:
    - cron: '*/5 * * * *' # her 5 dakikada
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FBST_API: https://fbst-api-mzum.onrender.com
      HORARY_API: https://horary-oracle-api.onrender.com
    steps:
      - name: Ping fbst-api (ana backend)
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            "$FBST_API/api/health"
          echo "fbst-api OK"

      - name: Ping horary-oracle-api
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            "$HORARY_API/api/health"
          echo "horary-oracle-api OK"
