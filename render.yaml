services:
  - type: web
    name: fbst-api
    runtime: python
    rootDir: render-deploy
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
   - type: web
    name: horary-oracle-api
    runtime: python
    plan: free
    buildCommand: pip install -r horary_oracle/requirements.txt
    startCommand: uvicorn horary_oracle.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: horary-oracle-web
    runtime: python
    plan: free
    buildCommand: pip install -r horary_oracle/requirements.txt
    startCommand: streamlit run horary_oracle/horary_app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: MPLBACKEND
        value: "Agg"
      - key: PYTHON_VERSION
        value: "3.12.8"
  - type: web
    name: horary-pwa
    runtime: static
    plan: free
    buildCommand: cd horary_ios && flutter build web --release --dart-define=HORARY_API_URL=https://horary-oracle-api.onrender.com
    staticPublishPath: horary_ios/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html