# Holavon iOS: Codemagic Developer Portal entegrasyonu adi holavon_appstore.
# holavon_ios degisken grubu: SUPABASE_URL, SUPABASE_ANON_KEY,
# REVENUECAT_IOS_KEY (appl_...), IOS_FIREBASE_PLIST (plist icerigi).
# App Store signing sertifikasi ve profili Codemagic Code signing identities'e eklenmeli.

workflows:
  horary-ios:
    name: Horary iOS (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: horary_ios
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=ios/Runner/ExportOptions.plist || flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.app
    publishing:
      email:
        recipients:
          - smyrnaastrology@gmail.com
  horary-android:
    name: Horary Android (APK/AAB)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    working_directory: horary_mobile
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --dart-define=HORARY_API_URL=https://horary-oracle-api.onrender.com
      - name: Build AAB
        script: |
          flutter build appbundle --release --dart-define=HORARY_API_URL=https://horary-oracle-api.onrender.com
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - smyrnaastrology@gmail.com
  fast-ios-release:
    name: Holavon iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: holavon_appstore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fastastrology.fastApp
      groups:
        - holavon_ios
      vars:
        BUNDLE_ID: com.fastastrology.fastApp
        PROJECT_PATH: fast_mobile/flutter_app
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up signing
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$PROJECT_PATH/ios/Runner.xcodeproj"
      - name: Validate configuration and load Firebase plist
        script: |
          set -eu
          : "${SUPABASE_URL:?SUPABASE_URL is missing}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is missing}"
          : "${REVENUECAT_IOS_KEY:?REVENUECAT_IOS_KEY is missing}"
          : "${IOS_FIREBASE_PLIST:?IOS_FIREBASE_PLIST is missing}"
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo 'Use a Supabase publishable or anon key, not a secret key'; exit 1;; esac
          case "$REVENUECAT_IOS_KEY" in appl_*) ;; *) echo 'Use the RevenueCat iOS public API key'; exit 1;; esac
          PLIST="$CM_BUILD_DIR/$PROJECT_PATH/ios/Runner/GoogleService-Info.plist"
          printf '%s' "$IOS_FIREBASE_PLIST" > "$PLIST"
          /usr/bin/plutil -lint "$PLIST"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST")" = "$BUNDLE_ID" ] || { echo 'Firebase iOS bundle ID mismatch'; exit 1; }
      - name: CocoaPods install
        script: |
          set -eu
          cd "$CM_BUILD_DIR/$PROJECT_PATH"
          flutter pub get
          cd ios
          pod install --repo-update
      - name: Flutter build ipa
        script: |
          set -eu
          cd "$CM_BUILD_DIR/$PROJECT_PATH"
          flutter pub get
          # ML Kit eklentileri SwiftPM desteklemedigi icin CocoaPods zorunlu.
          # Podfile korunur ve ios/Podfile icindeki 15.5 deployment target kullanilir.
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_API_KEY="$REVENUECAT_IOS_KEY"
    artifacts:
      - fast_mobile/flutter_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
